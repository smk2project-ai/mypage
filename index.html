<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>マイページ</title>
<!--
  代理店マイページ（かんたん版）2026-11-26
  公式LINE「代理店サポート」のリッチメニュー（マイページ）から LIFF で開く。LINE ID で本人を確かめ、組織とコミッション明細PDFを見せる。
  サーバー：MK2/gas/org/Mypage.js（組織管理と同じ GAS。orgLineLogin / orgLiteData / orgLitePdfs / orgLitePdf）
  file:// か ?sample で開くと見本データで動く。
-->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f6f4ee; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3dfd4;
    --black:#0b0b0b; --gold:#c9a24a; --gold-soft:#f6eed9; --grey:#9a9aa0; --red:#b3403a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
  header{background:var(--black);color:var(--gold);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:18px;letter-spacing:.06em}
  header .who{color:#fff;font-size:13px;margin-top:2px;opacity:.9}
  header select{margin-top:8px;font-size:16px;padding:4px 8px;border-radius:6px;border:1px solid var(--gold);background:#1a1a1a;color:#fff}
  .tabs{display:flex;background:var(--black);border-top:1px solid #222}
  .tabs button{flex:1 1 0;padding:10px 0;border:0;background:none;color:#bbb;font:inherit;font-weight:600;border-bottom:3px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
  main{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .hero{background:var(--black);color:#fff;border:0}
  .hero .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
  .hero .n{font-size:22px;font-weight:700;color:var(--gold);line-height:1.2}
  .hero .l{font-size:11px;color:#ccc}
  h2{font-size:15px;margin:0 0 8px}
  .muted{color:var(--muted);font-size:12.5px}
  .tree{list-style:none;margin:0;padding:0}
  .tree ul{list-style:none;margin:0;padding-left:14px;border-left:1px dashed var(--line);margin-left:9px}
  .row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #f0ede5;min-width:0}
  .tg{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:12px;line-height:18px;text-align:center;color:var(--muted);padding:0}
  .tg.empty{visibility:hidden}
  .nm{flex:1 1 auto;min-width:0}
  .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm span{font-size:11.5px;color:var(--muted)}
  .lv{flex:none;font-size:12px;font-weight:700;background:var(--gold-soft);color:#7a5a12;border-radius:6px;padding:1px 7px}
  .off .nm b,.off .lv{color:var(--grey)} .off .lv{background:#eee}
  .seg{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--black);color:var(--gold);border-color:var(--black)}
  .cus{list-style:none;margin:0;padding:0}
  .cus>li{border-bottom:1px solid #f0ede5}
  .cus .hd{width:100%;display:flex;gap:8px;align-items:center;padding:10px 4px;border:0;background:none;font:inherit;color:inherit;text-align:left}
  .cus .hd .nm b{white-space:normal}
  .badge{flex:none;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px}
  .badge.ok{background:#e0f4f0;color:#17705f} .badge.wait{background:#fdf1e3;color:#9a560b}
  dl.kv{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:4px 10px;margin:0 4px 12px;padding:10px 12px;background:#faf8f3;border-radius:8px;font-size:13.5px}
  dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
  .pdfs{list-style:none;margin:0;padding:0}
  .pdfs li button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid #f0ede5;background:none;font:inherit;color:inherit;text-align:left}
  .pdfs li button::after{content:"開く ›";color:#7a5a12;font-size:13px;font-weight:600}
  .viewer{position:fixed;inset:0;background:#2b2b2b;z-index:20;display:flex;flex-direction:column}
  .viewer .bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--black);color:#fff}
  .viewer .bar b{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewer .bar button,.viewer .bar a{border:1px solid var(--gold);color:var(--gold);background:none;border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;text-decoration:none}
  .pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px}
  .pages canvas{display:block;width:100%;height:auto;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .center{text-align:center;padding:40px 16px;color:var(--muted)}
  .err{color:var(--red);font-weight:600}
  .btn{display:inline-block;margin-top:12px;border:1px solid var(--black);border-radius:8px;padding:8px 16px;color:var(--black);text-decoration:none;font-weight:600;background:#fff}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sample{background:#fff3d4;color:#8a5c00;font-size:12px;text-align:center;padding:4px}
</style>
</head>
<body>
<div class="sample" id="sampleBar" hidden>見本データで表示中</div>
<header>
  <h1>マイページ</h1>
  <div class="who" id="who"></div>
  <select id="codeSel" hidden aria-label="代理店コードの切り替え"></select>
</header>
<nav class="tabs" id="tabs" hidden>
  <button type="button" data-tab="org" aria-selected="true">組織</button>
  <button type="button" data-tab="cus" aria-selected="false">お客様</button>
  <button type="button" data-tab="pdf" aria-selected="false">明細</button>
</nav>
<main>
  <div id="loading" class="center"><div class="spin"></div>読み込み中…</div>
  <div id="error" class="center" hidden><p class="err" id="errText"></p><a class="btn" href="https://line.me/R/ti/p/@904knxqb">代理店サポートを開く</a></div>

  <section id="orgView" hidden>
    <div class="card hero"><div class="grid">
      <div><div class="n" id="sLv">-</div><div class="l">レベル</div></div>
      <div><div class="n" id="sPt">-</div><div class="l">累積ポイント</div></div>
      <div><div class="n" id="sDirect">-</div><div class="l">直紹介</div></div>
      <div><div class="n" id="sCount">-</div><div class="l">組織の人数</div></div>
    </div></div>
    <div class="card">
      <h2>組織</h2>
      <p class="muted">あなたと、あなたより下の代理店です。▸ を押すと下の代理店が開きます。灰色はサブスクのお支払いが確認できない方です。</p>
      <ul class="tree" id="tree"></ul>
      <p class="muted" id="asOf"></p>
    </div>
  </section>

  <section id="cusView" hidden>
    <div class="card">
      <h2>お客様</h2>
      <div class="seg" id="cusScope">
        <button type="button" data-v="mine" aria-pressed="true">あなたが紹介</button>
        <button type="button" data-v="all" aria-pressed="false">組織全体</button>
      </div>
      <div class="seg" id="cusKind"></div>
      <p class="muted" id="cusNote"></p>
      <ul class="cus" id="cusList"></ul>
    </div>
  </section>

  <section id="pdfView" hidden>
    <div class="card">
      <h2>コミッション明細（PDF）</h2>
      <p class="muted">月を押すと明細が開きます。</p>
      <ul class="pdfs" id="pdfList"></ul>
      <div id="pdfMsg" class="center" hidden></div>
    </div>
  </section>
</main>

<div class="viewer" id="viewer" hidden>
  <div class="bar"><b id="vTitle"></b><a id="vSave" download hidden>保存</a><button type="button" id="vClose">閉じる</button></div>
  <div class="pages" id="pages"></div>
</div>

<script>
(function () {
  var LIFF_ID = ''; // LIFF「代理店マイページ」の ID（作成後に入れる）
  var API = 'https://script.google.com/macros/s/AKfycbwyc_V9ne9NUuGtLDPJpf5fEPTEzb8sRDJNuzt-3QaBPgZjnj3IiAjo3Rhuxj_XxMg-/exec';
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  var SAMPLE = location.protocol === 'file:' || /[?&]sample\b/.test(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var session = '', D = null, pdfCache = {}, pdfCode = '';

  function show(id) { ['loading', 'error', 'orgView', 'cusView', 'pdfView'].forEach(function (x) { $(x).hidden = x !== id; }); }
  function fail(msg) { $('errText').textContent = msg; $('tabs').hidden = true; show('error'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function call(fn, args) {
    if (SAMPLE) return Promise.resolve(sample(fn, args));
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'エラー'); return j.result; });
  }

  /* ---------- 組織 ---------- */
  function render(data) {
    D = data;
    var me = data.agents[0];
    $('who').textContent = me.code + '　' + me.name + ' さん';
    var sel = $('codeSel');
    sel.hidden = data.codes.length < 2;
    sel.innerHTML = data.codes.map(function (c) { return '<option value="' + esc(c) + '"' + (c === data.me ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
    $('sLv').textContent = 'Lv' + me.level;
    $('sPt').textContent = Math.round(me.pt * 10) / 10;
    $('sDirect').textContent = me.direct;
    $('sCount').textContent = data.agents.length - 1;
    $('asOf').textContent = data.asOf ? data.asOf + ' 時点' : '';
    var kids = {};
    data.agents.forEach(function (a) { if (a.parent) (kids[a.parent] = kids[a.parent] || []).push(a); });
    function node(a, depth) {
      var ch = kids[a.code] || [];
      var open = depth < 1;
      var li = '<li><div class="row' + (a.subsc ? '' : ' off') + '">' +
        '<button type="button" class="tg' + (ch.length ? '' : ' empty') + '" aria-expanded="' + open + '">' + (open ? '▾' : '▸') + '</button>' +
        '<div class="nm"><b>' + esc(a.name) + '</b><span>' + esc(a.code) + (ch.length ? '　下に' + countAll(a.code) + '人' : '') + (a.contracts ? '　紹介した契約 ' + a.contracts + '件' : '') + '</span></div>' +
        '<span class="lv">Lv' + esc(a.level) + '</span></div>';
      if (ch.length) li += '<ul' + (open ? '' : ' hidden') + '>' + ch.map(function (k) { return node(k, depth + 1); }).join('') + '</ul>';
      return li + '</li>';
    }
    function countAll(code) { var n = 0; (kids[code] || []).forEach(function (k) { n += 1 + countAll(k.code); }); return n; }
    $('tree').innerHTML = node(me, 0);
    $('tabs').hidden = false;
    pdfCode = '';
    tab(currentTab);
  }
  $('tree').addEventListener('click', function (e) {
    var b = e.target.closest('.tg');
    if (!b || b.classList.contains('empty')) return;
    var ul = b.closest('li').querySelector(':scope > ul');
    var open = ul.hidden;
    ul.hidden = !open;
    b.textContent = open ? '▾' : '▸';
    b.setAttribute('aria-expanded', open);
  });
  $('codeSel').addEventListener('change', function () {
    show('loading');
    call('orgLiteData', [session, this.value]).then(function (r) { if (!r.ok) return fail(r.message); render(r.data); }).catch(function (e) { fail('読み込めませんでした。時間をおいて開き直してください。（' + e.message + '）'); });
  });

  /* ---------- お客様 ---------- */
  var cus = { scope: 'mine', kind: 'done', open: -1 };
  function usd(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
  function nameOf(code) { var a = (D.agents || []).filter(function (x) { return x.code === code; })[0]; return a ? a.name + '（' + code + '）' : code; }
  function waitState(k) { return k.app ? '決済待ち' : '番号待ち'; }
  function renderCus() {
    var all = (D.customers || []).filter(function (k) { return cus.scope === 'all' || k.intro === D.me; });
    var done = all.filter(function (k) { return !!k.act; }), wait = all.filter(function (k) { return !k.act; });
    $('cusKind').innerHTML = '<button type="button" data-v="done" aria-pressed="' + (cus.kind === 'done') + '">契約済み ' + done.length + '</button>' +
      '<button type="button" data-v="wait" aria-pressed="' + (cus.kind === 'wait') + '">手続き中 ' + wait.length + '</button>';
    Array.prototype.forEach.call($('cusScope').children, function (b) { b.setAttribute('aria-pressed', b.dataset.v === cus.scope); });
    var list = cus.kind === 'done' ? done : wait;
    if (cus.kind === 'done') list.sort(function (a, b) { return String(b.act).localeCompare(String(a.act)) || String(b.req).localeCompare(String(a.req)); });
    else list.sort(function (a, b) { return String(b.req).localeCompare(String(a.req)); });
    $('cusNote').textContent = cus.kind === 'done' ? '初回の決済が新しい順です。名前を押すと詳しく出ます。' : '手続き中：番号待ち＝本申込の前、決済待ち＝本申込済み。申込みが新しい順です。';
    $('cusList').innerHTML = list.length ? list.map(function (k, i) {
      var sub = (cus.scope === 'all' && k.intro !== D.me ? '紹介 ' + esc(nameOf(k.intro)) + '　' : '') + usd(k.amount) + '／' + esc(k.years) + '年' +
        (k.act ? '　初回の決済 ' + esc(k.act) : '　申込み ' + esc(k.req || '—'));
      var h = '<li><button type="button" class="hd" data-i="' + i + '"><div class="nm"><b>' + esc(k.name) + '</b><span>' + sub + '</span></div>' +
        (k.act ? '<span class="badge ok">契約済み</span>' : '<span class="badge wait">' + waitState(k) + '</span>') + '</button>';
      if (cus.open === i) h += '<dl class="kv">' +
        '<dt>内容</dt><dd>' + usd(k.amount) + '／' + esc(k.years) + '年／' + esc(k.pay || '—') + '</dd>' +
        '<dt>申込み</dt><dd>' + esc(k.req || '—') + '</dd>' +
        '<dt>本申込</dt><dd>' + esc(k.app || 'まだ') + '</dd>' +
        '<dt>初回の決済</dt><dd>' + esc(k.act || 'まだ') + '</dd>' +
        '<dt>実績月</dt><dd>' + esc(k.month || '—') + '</dd>' +
        '<dt>ポイント</dt><dd>' + (Math.round((k.point || 0) * 10) / 10) + 'P</dd>' +
        '<dt>紹介者</dt><dd>' + esc(nameOf(k.intro)) + '</dd>' +
        (k.adv ? '<dt>アドバイザー</dt><dd>' + esc(nameOf(k.adv)) + '</dd>' : '') + '</dl>';
      return h + '</li>';
    }).join('') : '<li class="center">' + (cus.kind === 'done' ? '契約はまだありません。' : '手続き中のお客様はいません。') + '</li>';
    cus.list = list;
  }
  $('cusScope').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { cus.scope = b.dataset.v; cus.open = -1; renderCus(); } });
  $('cusKind').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { cus.kind = b.dataset.v; cus.open = -1; renderCus(); } });
  $('cusList').addEventListener('click', function (e) { var b = e.target.closest('.hd'); if (b) { var i = Number(b.dataset.i); cus.open = cus.open === i ? -1 : i; renderCus(); } });

  /* ---------- タブ ---------- */
  var currentTab = /^#(org|cus|pdf)$/.test(location.hash) ? location.hash.slice(1) : 'org'; // #cus などで最初のタブを選べる
  function tab(name) {
    currentTab = name;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.setAttribute('aria-selected', b.dataset.tab === name); });
    show(name + 'View');
    if (name === 'pdf') loadPdfs();
    if (name === 'cus') renderCus();
    window.scrollTo(0, 0);
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) tab(b.dataset.tab); });

  /* ---------- 明細PDF ---------- */
  function loadPdfs() {
    if (pdfCode === D.me) return;
    pdfCode = D.me;
    $('pdfList').innerHTML = '';
    $('pdfMsg').hidden = false;
    $('pdfMsg').innerHTML = '<div class="spin"></div>明細を探しています…';
    call('orgLitePdfs', [session, D.me]).then(function (r) {
      if (!r.ok) { $('pdfMsg').innerHTML = '<span class="err">' + esc(r.message) + '</span>'; return; }
      if (!r.list.length) { $('pdfMsg').textContent = 'まだ明細はありません。'; return; }
      $('pdfMsg').hidden = true;
      $('pdfList').innerHTML = r.list.map(function (p) { return '<li><button type="button" data-id="' + esc(p.id) + '" data-label="' + esc(p.label) + '">' + esc(p.label) + '分</button></li>'; }).join('');
    }).catch(function (e) { pdfCode = ''; $('pdfMsg').innerHTML = '<span class="err">読み込めませんでした（' + esc(e.message) + '）</span>'; });
  }
  $('pdfList').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) openPdf(b.dataset.id, b.dataset.label);
  });

  var pdfjsReady = null;
  function loadPdfJs() {
    if (pdfjsReady) return pdfjsReady;
    pdfjsReady = new Promise(function (ok, ng) {
      var s = document.createElement('script');
      s.src = PDFJS + 'pdf.min.js';
      s.onload = function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
      s.onerror = function () { pdfjsReady = null; ng(new Error('表示の準備ができませんでした')); };
      document.head.appendChild(s);
    });
    return pdfjsReady;
  }
  function openPdf(id, label) {
    $('vTitle').textContent = label + '分 コミッション明細';
    $('pages').innerHTML = '<div class="center" style="color:#ddd"><div class="spin"></div>開いています…</div>';
    $('vSave').hidden = true;
    $('viewer').hidden = false;
    document.body.style.overflow = 'hidden';
    var got = pdfCache[id] ? Promise.resolve(pdfCache[id]) : call('orgLitePdf', [session, D.me, id]).then(function (r) {
      if (!r.ok) throw new Error(r.message);
      return (pdfCache[id] = r);
    });
    Promise.all([got, loadPdfJs()]).then(function (x) {
      var r = x[0], lib = x[1];
      var bin = atob(r.b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      try {
        var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        $('vSave').href = url; $('vSave').setAttribute('download', r.name || 'meisai.pdf'); $('vSave').hidden = false;
      } catch (e) { /* 保存できない端末は表示だけ */ }
      return lib.getDocument({ data: bytes }).promise.then(function (doc) {
        $('pages').innerHTML = '';
        var chain = Promise.resolve();
        for (var p = 1; p <= doc.numPages; p++) (function (n) {
          chain = chain.then(function () { return doc.getPage(n); }).then(function (page) {
            var w = Math.min($('pages').clientWidth - 20, 900);
            var base = page.getViewport({ scale: 1 });
            var ratio = window.devicePixelRatio || 1;
            var vp = page.getViewport({ scale: (w / base.width) * ratio });
            var c = document.createElement('canvas');
            c.width = vp.width; c.height = vp.height;
            $('pages').appendChild(c);
            return page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          });
        })(p);
        return chain;
      });
    }).catch(function (e) {
      $('pages').innerHTML = '<div class="center" style="color:#fbb">' + esc(e.message || '開けませんでした') + '</div>';
    });
  }
  $('vClose').addEventListener('click', function () { $('viewer').hidden = true; document.body.style.overflow = ''; });

  /* ---------- はじまり ---------- */
  function start() {
    if (SAMPLE) {
      $('sampleBar').hidden = false;
      return call('orgLineLogin', ['', '']).then(function (r) { session = 'sample'; render(r.data); });
    }
    if (!LIFF_ID) return fail('準備中です。');
    return liff.init({ liffId: LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      return call('orgLineLogin', [liff.getIDToken(), '']).then(function (r) {
        if (!r.ok && r.relogin && !sessionStorage.getItem('mp_relogin')) {
          // IDトークンの期限切れ：1回だけログインし直す
          sessionStorage.setItem('mp_relogin', '1');
